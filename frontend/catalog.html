<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercury — Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="nav-root"></header>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="panel-index">01</span>
      <h2>Add Product</h2>
    </div>
    <div class="panel-body">
      <div class="row add-product-row">
        <input id="newProductName" placeholder="product name">
        <input id="newProductPrice" type="number" placeholder="price">
        <input id="newProductCategory" placeholder="category">
        <input id="newProductStock" type="number" placeholder="stock">
        <button class="btn-primary" style="width:auto" id="addProductBtn">+ Add</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="panel-index">02</span>
      <h2>Catalog</h2>
    </div>
    <div class="panel-body">
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>
</main>

<script src="shared.js"></script>
<script src="catalog.js"></script>
</body>
</html>
