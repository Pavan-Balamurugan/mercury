services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury
      POSTGRES_DB: mercury
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql://mercury:mercury@postgres:5432/mercury
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./product-service
    environment:
      DATABASE_URL: postgresql://mercury:mercury@postgres:5432/mercury
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    environment:
      DATABASE_URL: postgresql://mercury:mercury@postgres:5432/mercury
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: